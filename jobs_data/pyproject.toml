[project]
name = "jobs-data"
version = "0.1.0"
description = "Adzuna job ingestion into SQLite for the CV matchmaker corpus."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "numpy>=2.0.0",
    "pillow>=10.4.0",
    "pypdfium2>=4.30.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=3.0.0",
    "torch>=2.7.0",
    "uvicorn[standard]>=0.30.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "platform_system == 'Linux'" },
]

[dependency-groups]
dev = [
    "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
